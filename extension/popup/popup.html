<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabSense</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header with TabSense Branding -->
  <header class="header">
    <div class="logo-icon" aria-hidden="true">
      <!-- Minimalist layers/tabs SVG Icon -->
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 18h16v2H4zm0-4h16v2H4zm0-4h16v2H4zm0-4h16v2H4z" opacity=".3"/>
        <path d="M2 6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v2H2zm0 6h20v2H2zm0 6h20v2H2z" fill="#fff"/>
      </svg>
    </div>
    <span class="logo-text">TabSense</span>
  </header>

  <!-- Main content area -->
  <main class="container">
    <div class="card">
      <h2 class="card-title">Active Session</h2>
      <p class="card-desc">Capture and index all your open tabs to seamlessly retrieve them later.</p>
    </div>

    <!-- Action Button -->
    <button id="save-session-btn" class="btn-primary" type="button">
      <!-- Icon inside button -->
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
        <polyline points="17 21 17 13 7 13 7 21"></polyline>
        <polyline points="7 3 7 8 15 8"></polyline>
      </svg>
      Save Current Session
    </button>

    <!-- Success Feedback Container -->
    <div id="status-container" class="status-area" role="status" aria-live="polite">
      <!-- Success Icon -->
      <svg class="status-icon" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
      </svg>
      <span id="status-text" class="status-text">Captured 0 tabs successfully!</span>
    </div>
  </main>

  <!-- Footer/Version Info -->
  <footer class="footer">
    TabSense v1.0.0
  </footer>

  <script src="popup.js"></script>
</body>
</html>
